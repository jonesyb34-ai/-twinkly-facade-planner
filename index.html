<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Twinkly Facade Planner</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,sans-serif}
body{margin:0;background:#090d16;color:#f8fafc;padding:12px 12px 40px}
.card{background:#131b2e;border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid #24324d}
h1{font-size:18px;margin:0 0 4px;color:#38bdf8}
h2{font-size:14px;margin:0 0 8px;color:#e2e8f0}
.sub{font-size:12px;color:#94a3b8;margin:0 0 8px}
.row{display:flex;gap:8px;margin-bottom:8px}
.col{flex:1}
label{display:block;font-size:11px;color:#cbd5e1;margin-bottom:3px;font-weight:600}
input,select{width:100%;padding:9px;border-radius:9px;border:1px solid #334155;background:#090d16;color:#fff;font-size:14px}
input.rng{padding:0;accent-color:#38bdf8}
.trow{display:flex;align-items:center;justify-content:space-between;padding-top:6px;border-top:1px solid #1e293b}
.msw{display:flex;gap:6px;margin-bottom:8px}
.mbtn{flex:1;padding:10px 6px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#94a3b8;font-weight:700;font-size:12px}
.mbtn.on{background:#0284c7;color:#fff;border-color:#38bdf8}
svg{width:100%;height:auto;background:#04070d;border-radius:10px;border:1px solid #24324d;display:block}
.arow{display:flex;gap:6px;margin-bottom:8px}
.abtn{background:#0284c7;color:#fff;border:0;border-radius:9px;padding:0 14px;font-weight:700;font-size:13px}
.item{display:flex;align-items:center;justify-content:space-between;background:#0f172a;padding:7px 10px;border-radius:9px;margin-bottom:5px;font-size:12px}
.qbtn{width:26px;height:26px;border-radius:7px;border:1px solid #334155;background:#1e293b;color:#fff;font-weight:700}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.sbox{background:#0f172a;padding:9px;border-radius:9px;border:1px solid #1e293b}
.sval{font-size:16px;font-weight:800;color:#38bdf8}
.slbl{font-size:11px;color:#94a3b8}
.buy{display:flex;justify-content:space-between;padding:7px 9px;background:rgba(16,185,129,.14);border:1px solid rgba(16,185,129,.4);border-radius:9px;margin-bottom:5px;font-size:12px;color:#a7f3d0}
</style>
</head>
<body>
<div class="card">
  <h1>Twinkly Facade Planner <span style="font-size:11px;color:#10b981">v6.3</span></h1>
  <div class="row">
    <div class="col"><label>House Width (m)</label><input type="number" id="wIn" value="10.0" step="0.1" oninput="run()"></div>
    <div class="col"><label>House Height (m)</label><input type="number" id="hIn" value="5.0" step="0.1" oninput="run()"></div>
  </div>
  <div style="margin-bottom:8px">
    <label>Column Spacing: <span id="spLbl" style="color:#38bdf8">20 cm</span></label>
    <input class="rng" type="range" id="spIn" min="0" max="50" value="20" oninput="run()">
  </div>
  <div class="row">
    <div class="col"><label>Windows</label><select id="winIn" onchange="run()"><option value="around">Route Around</option><option value="blank">Blank Out</option></select></div>
    <div class="col"><label>Depth (m)</label><input type="number" id="depIn" value="1.0" step="0.1" oninput="run()"></div>
  </div>
  <div class="trow"><label style="margin:0">Porch No-Light Cutoff</label><input type="checkbox" id="porchIn" checked style="width:19px;height:19px" onchange="run()"></div>
</div>
<div class="card">
  <div class="msw">
    <button class="mbtn on" id="bHave" onclick="setM('have')">Show With What I Have</button>
    <button class="mbtn" id="bNeed" onclick="setM('need')">Show With What I Need</button>
  </div>
  <svg id="svg" viewBox="0 0 800 440">
    <polygon points="30,410 30,56.6 481.4,56.6 557.25,30 633.1,56.6 770,56.6 770,410" fill="#111827" stroke="#38bdf8" stroke-width="2.5"/>
    <polygon points="481.4,410 481.4,56.6 557.25,30 633.1,56.6 633.1,410" fill="rgba(217,119,6,.16)"/>
    <rect id="porchBox" x="144.7" y="231.4" width="247.9" height="178.6" fill="rgba(239,68,68,.18)" stroke="#ef4444" stroke-width="1.5"/>
    <text id="porchTxt" x="178" y="326" fill="#fca5a5" font-size="13" font-weight="bold">PORCH NO-LIGHT</text>
    <rect x="67" y="68" width="70.3" height="201.4" fill="#04070d" stroke="#64748b" stroke-width="2"/>
    <rect x="218.7" y="68" width="111" height="102.6" fill="#04070d" stroke="#64748b" stroke-width="2"/>
    <rect x="485.1" y="71.8" width="144.3" height="91.2" fill="#04070d" stroke="#64748b" stroke-width="2"/>
    <rect x="485.1" y="231.4" width="144.3" height="114" fill="#04070d" stroke="#64748b" stroke-width="2"/>
    <g id="leds"></g>
  </svg>
  <div class="stats">
    <div class="sbox"><div class="sval" id="oOut">0.0 m</div><div class="slbl">What You Have</div></div>
    <div class="sbox"><div class="sval" id="nOut">0.0 m</div><div class="slbl">Full House Needed</div></div>
  </div>
</div>
<div class="card">
  <h2>1. What I Have Already</h2>
  <div class="arow">
    <select id="pSel">
      <option value="s600">Strings 600 (48m)</option>
      <option value="s400">Strings 400 (32m)</option>
      <option value="s250">Strings 250 (20m)</option>
      <option value="s100">Strings 100 (8m)</option>
      <option value="hd750">Strings HD 750 (30m)</option>
      <option value="c400">Curtains 400 (40m)</option>
      <option value="c210">Curtains 210 (21m)</option>
      <option value="ic190">Icicles 190 (15m)</option>
      <option value="cl400">Cluster 400 (6m)</option>
      <option value="d400">Dots 400 (20m)</option>
      <option value="d200">Dots 200 (10m)</option>
      <option value="f40">Festoon 40 (20m)</option>
      <option value="f20">Festoon 20 (10m)</option>
      <option value="c9">C9 Bulbs (12m)</option>
      <option value="net">Net Lights (12m)</option>
      <option value="perm">Permanent Lights (30m)</option>
      <option value="pro">Pro/Plus 250 (25m)</option>
    </select>
    <button class="abtn" onclick="addS()">+ Add</button>
  </div>
  <div id="invBox"></div>
</div>
<div class="card">
  <h2>2. Extra Sets to Buy</h2>
  <div id="buyBox"></div>
</div>
<script>
var M={s600:48,s400:32,s250:20,s100:8,hd750:30,c400:40,c210:21,ic190:15,cl400:6,d400:20,d200:10,f40:20,f20:10,c9:12,net:12,perm:30,pro:25};
var N={s600:'Strings 600 (48m)',s400:'Strings 400 (32m)',s250:'Strings 250 (20m)',s100:'Strings 100 (8m)',hd750:'Strings HD 750 (30m)',c400:'Curtains 400 (40m)',c210:'Curtains 210 (21m)',ic190:'Icicles 190 (15m)',cl400:'Cluster 400 (6m)',d400:'Dots 400 (20m)',d200:'Dots 200 (10m)',f40:'Festoon 40 (20m)',f20:'Festoon 20 (10m)',c9:'C9 Bulbs (12m)',net:'Net Lights (12m)',perm:'Permanent Lights (30m)',pro:'Pro/Plus 250 (25m)'};
var inv={},mode='have';
function setM(m){mode=m;document.getElementById('bHave').className=m==='have'?'mbtn on':'mbtn';document.getElementById('bNeed').className=m==='need'?'mbtn on':'mbtn';run();}
function addS(){var k=document.getElementById('pSel').value;inv[k]=(inv[k]||0)+1;run();}
function chg(k,d){inv[k]=(inv[k]||0)+d;if(inv[k]<=0)delete inv[k];run();}
function run(){
  var box=document.getElementById('invBox');box.innerHTML='';var owned=0,any=false;
  for(var k in inv){var q=inv[k]||0;if(q>0){any=true;owned+=M[k]*q;var r=document.createElement('div');r.className='item';r.innerHTML='<span>'+N[k]+' x'+q+'</span><div><button class="qbtn" onclick="chg(\''+k+'\',-1)">-</button><button class="qbtn" style="margin-left:6px" onclick="chg(\''+k+'\',1)">+</button></div>';box.appendChild(r);}}
  if(!any)box.innerHTML='<p class="sub">No sets added yet.</p>';
  var W=Math.max(2,parseFloat(document.getElementById('wIn').value)||10);
  var H=Math.max(2,parseFloat(document.getElementById('hIn').value)||5);
  var cm=parseInt(document.getElementById('spIn').value,10);
  document.getElementById('spLbl').textContent=cm+' cm';
  var step=Math.max(2,cm)/100,wMode=document.getElementById('winIn').value,dep=Math.max(0,parseFloat(document.getElementById('depIn').value)||0),pCut=document.getElementById('porchIn').checked;
  document.getElementById('porchBox').style.display=pCut?'block':'none';
  document.getElementById('porchTxt').style.display=pCut?'block':'none';
  var g=document.getElementById('leds');g.innerHTML='';
  var sx=function(v){return(30+v*740).toFixed(1);},sy=function(v){return(410-v*380).toFixed(1);};
  var tot=0,c=0,px=null,pt=null,pb=null,pal=['#38bdf8','#f43f5e','#10b981','#f59e0b','#a855f7'];
  for(var x=0.05;x<=W-0.05;x+=step){
    var nx=x/W,top=(nx>=0.61&&nx<=0.815)?0.93+0.07*Math.max(0,1-Math.abs(nx-0.7125)/0.1025):0.93,bot=(pCut&&nx>=0.155&&nx<=0.49)?0.47:0.02;
    var m=(top-bot)*H+step;if(nx>=0.41&&nx<=0.49)m+=dep;
    if(wMode==='around'){if(nx>=0.05&&nx<=0.145)m+=Math.min(nx-0.05,0.145-nx)*2*W;if(nx>=0.255&&nx<=0.405)m+=Math.min(nx-0.255,0.405-nx)*2*W;if(nx>=0.615&&nx<=0.81)m+=Math.min(nx-0.615,0.81-nx)*4*W;}
    var lit=mode==='need'||tot<owned,sc=lit?pal[c%5]:'rgba(100,116,139,.3)',x1=sx(nx),y1=sy(top),y2=sy(bot);
    var l=document.createElementNS('http://w3.org');l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x1);l.setAttribute('y2',y2);l.setAttribute('stroke',sc);l.setAttribute('stroke-width','2.2');g.appendChild(l);
    if(px!==null){var ly=(c-1)%2===0?Math.max(parseFloat(pb),parseFloat(y2)):Math.min(parseFloat(pt),parseFloat(y1));var l2=document.createElementNS('http://w3.org');l2.setAttribute('x1',px);l2.setAttribute('y1',ly.toFixed(1));l2.setAttribute('x2',x1);l2.setAttribute('y2',ly.toFixed(1));l2.setAttribute('stroke',sc);l2.setAttribute('stroke-width','2.2');g.appendChild(l2);}
    px=x1;pt=y1;pb=y2;tot+=m;c++;
  }
  document.getElementById('oOut').textContent=owned.toFixed(1)+' m';document.getElementById('nOut').textContent=tot.toFixed(1)+' m';
  var bBox=document.getElementById('buyBox');bBox.innerHTML='';var def=Math.max(0,tot-owned);
  if(def<=0.1)bBox.innerHTML='<div class="buy">Your sets cover the full house!</div>';
