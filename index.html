<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Twinkly Facade Planner</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: #0f172a; color: #f8fafc; padding: 16px; }
    .card { background: #1e293b; border-radius: 16px; padding: 16px; margin-bottom: 14px; border: 1px solid #334155; }
    h1 { font-size: 20px; margin: 0 0 4px 0; color: #38bdf8; }
    p.sub { font-size: 13px; color: #94a3b8; margin: 0 0 12px 0; }
    .row { display: flex; gap: 10px; margin-bottom: 10px; }
    .field { flex: 1; }
    label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 4px; font-weight: 600; }
    input[type="number"], select {
      width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #475569;
      background: #0f172a; color: #fff; font-size: 16px;
    }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; padding-top: 6px; }
    canvas { width: 100%; height: auto; background: #020617; border-radius: 12px; border: 1px solid #334155; display: block; }
    .badge { display: inline-block; background: #0284c7; color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 99px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Stage 1 Live Prototype</span>
    <h1>Twinkly Facade Planner</h1>
    <p class="sub">Enter your overall house width & height to auto-scale all wall & window proportions.</p>
    <div class="row">
      <div class="field">
        <label>House Width (m)</label>
        <input type="number" id="houseW" value="10.0" step="0.1" min="2" max="50" />
      </div>
      <div class="field">
        <label>House Height (m)</label>
        <input type="number" id="houseH" value="5.0" step="0.1" min="2" max="20" />
      </div>
    </div>
    <div class="toggle-row">
      <label style="margin:0;">Keep Porch Area No-Light (Clear)</label>
      <input type="checkbox" id="porchNoLight" checked style="width:20px;height:20px;" />
    </div>
  </div>

  <div class="card">
    <label>Facade Geometry Preview (<span id="dimLabel">10.0m × 5.0m</span>)</label>
    <canvas id="houseCanvas" width="800" height="440"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('houseCanvas');
    const ctx = canvas.getContext('2d');
    const wInput = document.getElementById('houseW');
    const hInput = document.getElementById('houseH');
    const porchToggle = document.getElementById('porchNoLight');
    const dimLabel = document.getElementById('dimLabel');

    function draw() {
      const W = parseFloat(wInput.value) || 10.0;
      const H = parseFloat(hInput.value) || 5.0;
      dimLabel.textContent = `${W.toFixed(1)}m × ${H.toFixed(1)}m`;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const pad = 40;
      const drawW = canvas.width - pad * 2;
      const drawH = canvas.height - pad * 2;
      const sx = (px) => pad + px * drawW;
      const sy = (py) => canvas.height - pad - py * drawH;

      // Main flat-roof facade + narrow brick apex above Window 3
      ctx.fillStyle = '#1e293b';
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(sx(0), sy(0));
      ctx.lineTo(sx(0), sy(0.93));
      ctx.lineTo(sx(0.61), sy(0.93));
      ctx.lineTo(sx(0.712), sy(1.0));
      ctx.lineTo(sx(0.815), sy(0.93));
      ctx.lineTo(sx(1.0), sy(0.93));
      ctx.lineTo(sx(1.0), sy(0));
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Porch area (x: 15.5% - 49%, y: 0 - 47%)
      ctx.fillStyle = porchToggle.checked ? 'rgba(239, 68, 68, 0.2)' : 'rgba(56, 189, 248, 0.1)';
      ctx.strokeStyle = porchToggle.checked ? '#ef4444' : '#64748b';
      ctx.setLineDash([6, 4]);
      ctx.fillRect(sx(0.155), sy(0.47), drawW * 0.335, drawH * 0.47);
      ctx.strokeRect(sx(0.155), sy(0.47), drawW * 0.335, drawH * 0.47);
      ctx.setLineDash([]);

      // Windows
      const windows = [
        { name: 'W1', x: 0.05, y: 0.37, w: 0.095, h: 0.53 },
        { name: 'W2', x: 0.255, y: 0.63, w: 0.15, h: 0.27 },
        { name: 'W3', x: 0.615, y: 0.65, w: 0.195, h: 0.24 },
        { name: 'W4', x: 0.615, y: 0.17, w: 0.195, h: 0.30 }
      ];
      ctx.fillStyle = '#0f172a';
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 2;
      windows.forEach(win => {
        const rx = sx(win.x), ry = sy(win.y + win.h), rw = drawW * win.w, rh = drawH * win.h;
        ctx.fillRect(rx, ry, rw, rh);
        ctx.strokeRect(rx, ry, rw, rh);
      });
    }

    [wInput, hInput, porchToggle].forEach(el => el.addEventListener('input', draw));
    draw();
  </script>
</body>
</html>
